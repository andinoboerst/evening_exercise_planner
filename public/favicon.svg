<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141a2e" />
      <stop offset="50%" stop-color="#0e1322" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" stroke="#232b45" stroke-width="4"/>
  <circle cx="256" cy="230" r="140" fill="url(#moonGlow)"/>

  <!-- Crescent Moon -->
  <path d="M305 130 C220 140 180 220 205 305 C145 285 135 195 190 145 C150 170 140 235 185 285 C235 340 330 325 350 250 C290 270 250 215 305 130 Z" 
        fill="url(#glowGrad)" filter="url(#softGlow)"/>

  <!-- Mat / Curve base -->
  <path d="M120 380 Q 256 350 392 380" stroke="#818cf8" stroke-width="14" stroke-linecap="round" fill="none" opacity="0.9"/>
  <path d="M140 405 Q 256 385 372 405" stroke="#ec4899" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.6"/>

  <!-- Little ambient stars -->
  <circle cx="370" cy="160" r="5" fill="#fbcfe8" opacity="0.8"/>
  <circle cx="150" cy="200" r="4" fill="#c7d2fe" opacity="0.7"/>
  <circle cx="340" cy="290" r="3.5" fill="#e0e7ff" opacity="0.6"/>
</svg>
